<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>gyazo-tycoon</title>
<style>
:root{--bg:#3d424c;--panel:#474d58;--line:#5d6471;--fg:#f0f2f5;--dim:#b4bac6;--accent:#7db2ff}
*{box-sizing:border-box}
html{overflow-x:hidden}
html,body{max-width:100%}  /* overflow は html だけに付ける(body に付けると body がスクロール容器になり、sticky ヘッダーが追従しない) */
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"Hiragino Sans",sans-serif;min-height:100vh;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:nowrap;gap:6px;align-items:center;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
select{background:#555c69;color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:6px 8px;font:inherit;font-size:16px}
input,button{background:#555c69;color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:6px 10px;font:inherit}
input{font-size:16px}  /* 16px未満だとiOSがフォーカス時にズームする */
button{cursor:pointer}
#q{flex:1 1 0;min-width:60px;width:0}
#sort{flex:none;width:104px;padding:6px 4px;text-overflow:ellipsis}  /* ヘッダーを1行に収める */
#statbar{position:fixed;right:8px;bottom:calc(6px + env(safe-area-inset-bottom));z-index:4;max-width:calc(100vw - 16px);padding:2px 8px;background:var(--panel);border:1px solid var(--line);border-radius:4px;color:var(--dim);font-size:11px;line-height:1.5;text-align:right;pointer-events:none;opacity:.95}  /* Scrapbox の「N pages」のような画面下のステータス */
#statbar:empty{display:none}
#pf.on{background:var(--accent);color:#123}
#grid{padding:10px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.tile{position:relative;aspect-ratio:1;background:#2f333b;border-radius:6px;overflow:hidden;cursor:pointer}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.tile .d{position:absolute;bottom:0;left:0;right:0;font-size:10px;background:#000a;padding:0 4px;color:#ddd}
.msg{padding:40px 16px;text-align:center;color:var(--dim);grid-column:1/-1}
#setup{max-width:480px;margin:40px auto;padding:0 16px;display:flex;flex-direction:column;gap:12px}
#setup[hidden],#app[hidden]{display:none}
#setup code{background:#2f333b;padding:0 4px;border-radius:3px;word-break:break-all}
#lb{position:fixed;inset:0;background:#000e;display:none;z-index:9;flex-direction:column}
#lb.on{display:flex}
#lbm{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:pinch-zoom}  /* 縦ドラッグは背面スクロールにせず上下スワイプ判定に使う */
#lbm img{width:100%;height:100%;object-fit:contain}  /* サムネイルと原寸で同じ枠・同じ位置にする(差し替え時に大きさが跳ねない) */
#lbi{height:25vh;overflow:auto;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--panel);font-size:12px}
#lbi a{color:var(--accent);word-break:break-all}
#lbi pre{white-space:pre-wrap;word-break:break-all;color:var(--dim);margin:6px 0 0}
@media (min-width:900px){  /* PC: 説明欄は画面下ではなく右に出す(閉じるボタンは画像側の右上へ) */
#lb{flex-direction:row}
#lbi{flex:0 0 400px;height:auto;padding:14px 16px;border-left:1px solid var(--line)}
#lbx{right:416px}
}
#lbm{position:relative}
#lbm.loading img,#lbm.failed img{filter:blur(3px) brightness(.7);-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}  /* 荒いサムネイルは保存できないようにする */
#lbm.loading::after{content:"";position:absolute;top:50%;left:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border:4px solid #fff5;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;pointer-events:none}
#lbm.failed::after{content:"読み込み失敗";position:absolute;top:50%;left:0;right:0;text-align:center;color:#ff8a8a;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
#gear,#rand{font-size:16px;padding:2px 6px;vertical-align:middle;flex:none}
#pf{margin-left:auto}
#cfg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;box-shadow:0 0 0 100vmax #000a;width:min(420px,88vw);padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--fg);font-size:12px}
#cfg[hidden]{display:none}
#cfg h3{margin:0 0 8px;font-size:14px}
#cfg section{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
#cfg label,#cfg dt{color:var(--dim)}
#cfg dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;color:var(--dim)}
#cfg dt::after{content:":"}
#cfg dt{padding-left:10px}#cfg dd{margin:0;color:var(--fg)}
#cfg input{width:100%}
#cfg section.danger{border:1px solid #c0504d;border-radius:6px;padding:10px;margin-top:8px;background:#c0504d14}
#cfg .danger h4{margin:0;color:#ff8a8a;font-size:12px}
#cfg .danger button{background:#8f2f2c;border-color:#c0504d;color:#fff;font-weight:bold}
#lbx{position:absolute;top:8px;right:8px;z-index:2;font-size:18px}
#lbu{margin:28px 0 8px;padding-top:12px;border-top:1px dashed var(--line)}  /* 誤タップを避けるため、他のボタンから離して置く */
#lbu .msg2{margin-top:6px;color:var(--dim);word-break:break-all}
#lbu .ok{color:#7ee2a0}#lbu .ng{color:#ff8a8a}
#lbu .rec{margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#lbsz.big{color:#ff6b6b;font-weight:bold}
#cfg input{font-size:16px}
#pw{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
#pw[hidden]{display:none}
#pwf{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;width:min(320px,90vw)}
#pwf input{width:100%;margin:8px 0}#pwe{color:#ff8a8a;min-height:1.5em}
.tile .d.x{color:var(--accent)}
</style>
</head>
<body>
<div id="setup" hidden>
  <h2>gyazo-tycoon</h2>
  <p>Dropbox アプリの App key を入力して認可します(この端末の localStorage にだけ保存。読み取り権限のみ要求)。</p>
  <p>このページのURL <code id="redir"></code> を、Dropbox アプリの Redirect URIs に登録しておいてください。</p>
  <input id="key" placeholder="App key" autocomplete="off" autocapitalize="off">
  <button id="login">Dropbox で認可する</button>
  <p id="err" style="color:#ff8a8a"></p>
</div>
<div id="app" hidden>
  <header>
    <input id="q" type="search" placeholder="検索">
    <select id="sort" title="並び順"><option value="new">新しい順</option><option value="old">古い順</option><option value="visited">最近開いた順</option><option value="viewed">閲覧数順</option></select>
    <button id="pf" title="Wi-Fi のときにサムネイルと閲覧数上位の画像を端末に先読みする(もう一度押すと中断)">⬇️</button>
    <button id="rand" title="ランダムジャンプ">🔀</button>
    <button id="lock" title="暗号化した画像" hidden>🔒</button>
    <button id="gear" title="設定" aria-expanded="false" aria-controls="cfg">⚙</button>
  </header>
  <div id="grid"></div>
</div>
<div id="statbar"><span id="bt"></span><span id="stat"></span><span id="pfs"></span></div>
<div id="cfg" hidden>
  <h3>設定</h3>
  <section>
    <button id="expv">閲覧履歴・メモを書き出す</button>
    <dl><dt>閲覧履歴</dt><dd id="cfgvis"></dd><dt>最終書き出し</dt><dd id="cfgexp"></dd></dl>
  </section>
  <section>
    <label for="imgurid">imgur Client-ID</label>
    <input id="imgurid" placeholder="匿名アップロード用" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label><input id="trash" type="checkbox"> ゴミも表示する</label>
    <label for="budget">キャッシュの上限(MB)</label>
    <input id="budget" type="number" inputmode="numeric" min="100" step="100">
  </section>
  <section class="danger">
    <h4>デンジャーゾーン</h4>
    <button id="cachedel">キャッシュ削除</button>
    <dl><dt>使用量</dt><dd id="cachesz">…</dd><dt>オリジナル</dt><dd id="cache-f"></dd><dt>サムネイル</dt><dd id="cache-t"></dd><dt>gif</dt><dd id="cache-a"></dd></dl>
    <button id="out">認可を取り消す</button>
  </section>
</div>
<div id="pw" hidden><form id="pwf"><div>暗号化した画像のパスフレーズ</div><input id="pwi" type="password" autocomplete="off" autocapitalize="off"><div id="pwe"></div><button>開く</button> <button type="button" id="pwc">キャンセル</button></form></div>
<div id="lb"><button id="lbx">✕</button><div id="lbm"></div><div id="lbi"></div></div>
<script src="build-info.js"></script>
<script src="crypto.js"></script>
<script>
const $=s=>document.querySelector(s);
const LS=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const LSset=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const REDIR=location.origin+location.pathname;
const SCOPE='files.content.read';
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');

// ---- 認可 (PKCE) ----
async function startLogin(){
  const key=$('#key').value.trim(); if(!key){$('#err').textContent='App key を入力してください';return}
  LSset('gt_key',key);
  const ver=b64u(crypto.getRandomValues(new Uint8Array(48))), state=b64u(crypto.getRandomValues(new Uint8Array(12)));
  const ch=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(ver)));
  LSset('gt_ver',ver); LSset('gt_state',state);
  location.href='https://www.dropbox.com/oauth2/authorize?'+new URLSearchParams({client_id:key,response_type:'code',
    code_challenge:ch,code_challenge_method:'S256',token_access_type:'offline',scope:SCOPE,redirect_uri:REDIR,state});
}
async function tokenReq(params){
  const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',body:new URLSearchParams(params)});
  if(!r.ok)throw new Error('token '+r.status+' '+(await r.text()).slice(0,150));
  return r.json();
}
let access=null,expires=0;
async function token(){
  if(access&&Date.now()<expires-60000)return access;
  const j=await tokenReq({grant_type:'refresh_token',refresh_token:LS('gt_refresh'),client_id:LS('gt_key')});
  access=j.access_token;expires=Date.now()+j.expires_in*1000;return access;
}
async function finishLogin(code,state){
  if(state!==LS('gt_state'))throw new Error('state が一致しません');
  const j=await tokenReq({grant_type:'authorization_code',code,code_verifier:LS('gt_ver'),client_id:LS('gt_key'),redirect_uri:REDIR});
  LSset('gt_refresh',j.refresh_token);LSset('gt_ver',null);LSset('gt_state',null);
  access=j.access_token;expires=Date.now()+j.expires_in*1000;
}

// ---- Dropbox 呼び出し ----
async function rpc(host,ep,arg){
  const r=await fetch('https://'+host+'/2/'+ep,{method:'POST',headers:{Authorization:'Bearer '+await token(),'Content-Type':'application/json'},body:JSON.stringify(arg)});
  if(!r.ok){const e=new Error(ep+' '+r.status);e.status=r.status;throw e}
  return r.json();
}
async function download(path){
  const r=await fetch('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{Authorization:'Bearer '+await token(),'Dropbox-API-Arg':JSON.stringify({path})}});
  if(!r.ok)throw new Error('download '+path+' '+r.status);
  return r.json();
}
async function downloadBuf(path){
  const r=await fetch('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{Authorization:'Bearer '+await token(),'Dropbox-API-Arg':JSON.stringify({path})}});
  if(!r.ok)throw new Error('download '+path+' '+r.status);
  return r.arrayBuffer();
}
async function downloadBlob(path){
  const r=await fetch('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{Authorization:'Bearer '+await token(),'Dropbox-API-Arg':JSON.stringify({path})}});
  if(!r.ok)throw new Error('download '+r.status);
  return r.blob();
}
// gif は静止サムネイルのあと、動くサムネイル(/index/anim/…webp)に差し替える
// 端末キャッシュ(Cache Storage): 原寸 150 枚・サムネイル 4000 枚・動くサムネイル 150 枚まで。⚙ から整理できる
const FULL_CACHE='gt-full-v1',THUMB_CACHE='gt-thumb-v1',ANIM_CACHE='gt-anim-v1';
// 端末キャッシュは「容量の上限(MB)」で管理する。サイズ・保存時刻は IndexedDB(gt_cache)に控える
// (Cache Storage からは大きさが分からないため)。上限を超えたら原寸→古い順に捨てる
const BUDGET=()=>Math.max(100,+LS('gt_budget')||3000)*1048576;
const CPFX={'/__full/':FULL_CACHE,'/__thumb/':THUMB_CACHE,'/__anim/':ANIM_CACHE};
const cacheOf=k=>CPFX[k.slice(0,k.indexOf('/',1)+1)];
let cmeta=null,cmetaTotal=0,mdbP=null;  // cmeta: Map<キー, {s: バイト数, t: 保存時刻}>
const mdb=()=>mdbP??=new Promise((ok,ng)=>{const r=indexedDB.open('gt_cache',1);r.onupgradeneeded=()=>r.result.createObjectStore('m');r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)});
async function metaLoad(){
  if(cmeta)return cmeta;
  const m=new Map();let tot=0;
  try{const d=await mdb();await new Promise(ok=>{const q=d.transaction('m').objectStore('m').openCursor();
    q.onsuccess=()=>{const c=q.result;if(c){m.set(c.key,c.value);tot+=c.value.s;c.continue()}else ok()};q.onerror=()=>ok()})}catch(e){}
  if(!cmeta){cmeta=m;cmetaTotal=tot}
  return cmeta;
}
async function metaSet(k,v){  // v=null で削除
  await metaLoad();
  const o=cmeta.get(k);if(o)cmetaTotal-=o.s;
  if(v){cmeta.set(k,v);cmetaTotal+=v.s}else cmeta.delete(k);
  try{const t=(await mdb()).transaction('m','readwrite');v?t.objectStore('m').put(v,k):t.objectStore('m').delete(k)}catch(e){}
}
async function cachePut(key,blob){
  try{const c=await caches.open(cacheOf(key));await c.put(key,new Response(blob,{headers:{'Content-Type':blob.type}}))}catch(e){return false}
  await metaSet(key,{s:blob.size,t:Date.now()});return true;
}
async function cacheDel(k){try{await (await caches.open(cacheOf(k))).delete(k)}catch(e){}await metaSet(k,null)}
async function enforce(keep){  // 上限を超えた分を、原寸 → サムネイルの順に古いものから捨てる
  await metaLoad();const b=BUDGET();
  if(cmetaTotal<=b)return;
  const ks=[...cmeta.entries()].sort((x,y)=>(x[0].startsWith('/__full/')?0:1)-(y[0].startsWith('/__full/')?0:1)||x[1].t-y[1].t);
  for(const [k] of ks){if(cmetaTotal<=b)break;if(k!==keep)await cacheDel(k)}
}
async function metaSync(){  // 控えと実際のキャッシュを突き合わせる(控えのない既存分は大きさを測る / 消えた分は控えから外す)
  await metaLoad();
  const seen=new Set();
  for(const name of [FULL_CACHE,THUMB_CACHE,ANIM_CACHE]){
    let c;try{c=await caches.open(name)}catch(e){continue}
    for(const r of await c.keys()){
      const k=r.url.slice(r.url.indexOf('/__'));seen.add(k);
      if(!cmeta.has(k)){try{const m=await c.match(r);await metaSet(k,{s:(await m.blob()).size,t:0})}catch(e){}}
    }
  }
  for(const k of [...cmeta.keys()])if(!seen.has(k))await metaSet(k,null);
}
async function metaClear(){cmeta=new Map();cmetaTotal=0;try{(await mdb()).transaction('m','readwrite').objectStore('m').clear()}catch(e){}}
const animCache=new Map();
async function animate(img){
  const id=img.dataset.id;
  try{
    if(!animCache.has(id))animCache.set(id,(async()=>{
      const key='/__anim/'+id;let blob=null,c=null;
      try{c=await caches.open(ANIM_CACHE);const m=await c.match(key);if(m)blob=await m.blob()}catch(e){}
      if(!blob){
        blob=await downloadBlob(`/index/anim/${id.slice(0,2)}/${id}.webp`);
        if(c){await cachePut(key,blob);await enforce(key)}
      }
      return URL.createObjectURL(blob);
    })());
    const u=await animCache.get(id);
    if(img.isConnected)img.src=u;
  }catch(e){animCache.delete(id);console.warn(e)}
}
const imgPath=it=>`/public/${it.i.slice(0,2)}/${it.i}.${it.e}`;

// ---- サムネイル: 25枚ずつ get_thumbnail_batch ----
const thumbQ=[],thumbBusy={v:false},thumbCache=new Map();
function wantThumb(img){thumbQ.push(img);pump()}
async function pump(){
  if(thumbBusy.v)return;thumbBusy.v=true;
  try{while(thumbQ.length){
    const batch0=thumbQ.splice(0,25).filter(i=>i.isConnected);
    await Promise.all(batch0.filter(i=>i.dataset.x).map(protThumb));
    const batch=batch0.filter(i=>!i.dataset.x);
    const todo=batch.filter(i=>{const c=thumbCache.get(i.dataset.id);if(c){i.src=c;if(i.dataset.a)animate(i);return false}return true});
    if(!todo.length)continue;
    // 端末キャッシュにあるものは Dropbox へ取りに行かない
    let rest=todo,tc=null;
    try{
      tc=await caches.open(THUMB_CACHE);
      const hits=await Promise.all(todo.map(async i=>{const m=await tc.match('/__thumb/'+i.dataset.id);return m?m.blob():null}));
      rest=[];
      todo.forEach((i,k)=>{
        if(!hits[k]){rest.push(i);return}
        const u=URL.createObjectURL(hits[k]);thumbCache.set(i.dataset.id,u);
        if(i.isConnected){i.src=u;if(i.dataset.a)animate(i)}
      });
    }catch(e){rest=todo}
    if(!rest.length)continue;
    try{
      const j=await rpc('content.dropboxapi.com','files/get_thumbnail_batch',{entries:rest.map(i=>({path:i.dataset.path,format:'jpeg',size:'w256h256',mode:'bestfit'}))});
      const puts=[];
      j.entries.forEach((e,k)=>{if(e['.tag']==='success'){
        const blob=new Blob([Uint8Array.from(atob(e.thumbnail),c=>c.charCodeAt(0))],{type:'image/jpeg'});
        const u=URL.createObjectURL(blob);thumbCache.set(rest[k].dataset.id,u);rest[k].src=u;if(rest[k].dataset.a)animate(rest[k]);
        puts.push(cachePut('/__thumb/'+rest[k].dataset.id,blob));
      }});
      await Promise.all(puts);if(puts.length)await enforce();
    }catch(e){console.warn(e)}
  }}finally{thumbBusy.v=false}
}
async function protThumb(img){
  const id=img.dataset.id;
  try{
    let u=thumbCache.get(id);
    if(!u){u=URL.createObjectURL(new Blob([await GT_CRYPTO.decrypt(pkey,await downloadBuf(`/protected/${id.slice(0,2)}/${id}.t.bin`),id+'.t')],{type:'image/jpeg'}));thumbCache.set(id,u)}
    if(img.isConnected)img.src=u;
  }catch(e){console.warn(e)}
}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);wantThumb(e.target)}}),{rootMargin:'400px'});

// ---- 閲覧履歴(この端末のみ。localStorage。last visited / most viewed 用) ----
const VISITS_KEY='gt_visits_v1';
const visits=(()=>{try{return JSON.parse(LS(VISITS_KEY)||'{}')}catch(e){return {}}})();  // {id: {t: 最終閲覧(ms), n: 回数}}
let visitTimer;
function recordVisit(id){
  const v=visits[id]||{t:0,n:0};visits[id]={t:Date.now(),n:v.n+1};
  clearTimeout(visitTimer);visitTimer=setTimeout(()=>LSset(VISITS_KEY,JSON.stringify(visits)),300);
}
// 閲覧履歴の書き出し(スマホ→Mac)。書き込み権限は使わず、JSON を「ファイル」に保存してもらい、
// Mac の gyazo-tycoon がその Dropbox フォルダ(gyazo-visits/)を読んで閲覧数に足す。
// 端末ごとの「累計」を書くので、何度書き出しても・同じファイルを何度取り込んでも二重に数えられない。
const DEVICE=(()=>{let d=LS('gt_device');if(!/^[0-9a-f]{16}$/.test(d||'')){d=[...crypto.getRandomValues(new Uint8Array(8))].map(b=>b.toString(16).padStart(2,'0')).join('');LSset('gt_device',d)}return d})();
async function exportVisits(){
  const out={};for(const[id,v]of Object.entries(visits))out[id]=[v.n,v.t];
  const nout={};for(const[id,e]of Object.entries(notes))nout[id]=[e.b,e.t];
  if(!Object.keys(out).length&&!Object.keys(nout).length){alert('まだ開いた画像も編集したメモもありません');return}
  const name=`gyazo-visits-${DEVICE}.json`;

// ---- 拡大 ----
// 原寸画像のキャッシュ: メモリ(blob URL, 直近24枚)+ Cache Storage(端末に残る, 直近150枚)。
// 取得は files/download(認可ヘッダ付き)。一度見た画像・先読みした前後の画像はスピナー無しで出る
const fullSize=new Map(),fullMem=new Map(),fullPending=new Map(),FULL_MEM=24;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function dlFull(it){  // 原寸を Dropbox から取る。429(レート制限)は待って取り直す
  for(let n=0;;n++){
    const r=await fetch('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{Authorization:'Bearer '+await token(),'Dropbox-API-Arg':JSON.stringify({path:imgPath(it)})}});
    if(r.status===429&&n<5){await sleep((+r.headers.get('Retry-After')||10)*1000);continue}
    if(!r.ok){const e=new Error('download '+r.status);e.status=r.status;throw e}
    return r.blob();
  }
}
async function getFull(it){
  const id=it.i;
  if(fullMem.has(id)){const u=fullMem.get(id);fullMem.delete(id);fullMem.set(id,u);return u}  // LRU更新
  if(fullPending.has(id))return fullPending.get(id);
  const p=(async()=>{
    let blob=null,cache=null;const key='/__full/'+id;
    if(it.x){  // 暗号化した画像: 復号した中身はメモリにだけ置く(端末のキャッシュには残さない)
      const mime={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',heic:'image/heic',mp4:'video/mp4'}[(it.e||'').toLowerCase()]||'application/octet-stream';
      blob=new Blob([await GT_CRYPTO.decrypt(pkey,await downloadBuf(`/protected/${id.slice(0,2)}/${id}.bin`),id)],{type:mime});
    }else try{cache=await caches.open(FULL_CACHE);const m=await cache.match(key);if(m)blob=await m.blob()}catch(e){}
    if(!blob){
      blob=await dlFull(it);
      if(cache){await cachePut(key,blob);await enforce(key)}
    }
    const u=URL.createObjectURL(blob);
    fullSize.set(id,blob.size);
    fullMem.set(id,u);
    while(fullMem.size>FULL_MEM){const [oid,ou]=fullMem.entries().next().value;fullMem.delete(oid);URL.revokeObjectURL(ou)}
    return u;
  })();
  fullPending.set(id,p);
  try{return await p}finally{fullPending.delete(id)}
}
// ---- imgur 匿名アップロード ----
// Client-ID は端末の localStorage(設定 ⚙ で入力)。アップロード後は URL をクリップボードへ。
// deletehash は画像ごとに localStorage へ残し、拡大表示から imgur 上の画像を削除できる(再アップロードの重複防止はしない)
const IMGUR='https://api.imgur.com/3/image',IMGUR_MAX=20*1024*1024;  // gif 以外の上限
const imgurRecs=()=>{try{return JSON.parse(LS('gt_imgur_up')||'{}')}catch(e){return {}}};
const imgurSave=o=>LSset('gt_imgur_up',JSON.stringify(o));
const imgurErr=async r=>{
  if(r.status===429)return 'imgur のレート制限です。しばらく待ってください';
  let m='';try{m=(await r.json()).data.error;if(typeof m==='object')m=m.message}catch(e){}
  return 'imgur '+r.status+(m?': '+m:'');
};
async function imgurUpload(it){
  const id=LS('gt_imgur');if(!id)throw new Error('設定(⚙)で imgur の Client-ID を入力してください');
  const blob=await (await fetch(await getFull(it))).blob();
  if(it.e!=='gif'&&blob.size>IMGUR_MAX)throw new Error('20MB を超えています('+(blob.size/1048576).toFixed(1)+'MB)');
  const f=new FormData();f.append('image',blob,it.i+'.'+it.e);f.append('type','file');
  const r=await fetch(IMGUR,{method:'POST',headers:{Authorization:'Client-ID '+id},body:f});
  if(!r.ok)throw new Error(await imgurErr(r));
  const d=(await r.json()).data;
  const o=imgurRecs();(o[it.i]=o[it.i]||[]).push({link:d.link,hash:d.deletehash,t:Date.now()});imgurSave(o);
  return d;
}
function renderImgur(it,msg){
  const el=$('#lbu');if(!el)return;
  const recs=imgurRecs()[it.i]||[];
  el.innerHTML=it.x?'<span style="color:var(--dim)">暗号化した画像は imgur にアップロードできません</span>':it.e==='mp4'?'<span style="color:var(--dim)">動画は imgur へのアップロードに対応していません</span>'
    :`<button id="lbimg">imgur にアップロード</button>${msg?`<div class="msg2 ${msg.ok?'ok':'ng'}">${esc(msg.t)}</div>`:''}`
    +recs.map(r=>`<div class="rec"><a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.link)}</a><button class="lbcp" data-l="${esc(r.link)}">コピー</button><button class="lbdel" data-h="${esc(r.hash)}">削除</button></div>`).join('');
}
async function imgurClick(){
  const it=filtered[cur];if(!it)return;

    const up=imgurUpload(it).then(d=>(data=d));
    // iOS Safari はユーザー操作の直後でないとコピーできないので、Promise のまま ClipboardItem に渡す

    }

}
async function copyUrl(btn){

    try{const t=document.createElement('textarea');t.value=l;t.style.cssText='position:fixed;opacity:0';document.body.append(t);t.select();ok=document.execCommand('copy');t.remove()}catch(e2){}

async function imgurDelete(btn){

// 画像サイズ(原寸を取得してから分かる)。imgur の上限 20MB を超えていたら赤字で強調
const fmtSize=n=>n>=1048576?(n/1048576).toFixed(1)+'MB':Math.max(1,Math.round(n/1024))+'KB';
function showSize(it,tok){

// HEIC は Safari 以外のブラウザでデコードできない: 失敗したら heic2any(遅延読み込み)で JPEG に変換する
let heicLib=null;
async function heicToJpeg(it,url){
  if(!heicLib)heicLib=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';s.onload=()=>res(window.heic2any);s.onerror=()=>{heicLib=null;rej(new Error('heic2any load failed'))};document.head.appendChild(s)});
  const conv=await (await heicLib)({blob:await (await fetch(url)).blob(),toType:'image/jpeg',quality:.9});
  const nu=URL.createObjectURL(Array.isArray(conv)?conv[0]:conv);
  if(fullMem.has(it.i)){URL.revokeObjectURL(fullMem.get(it.i));fullMem.set(it.i,nu)}
  return nu;
}
async function openLb(k){

}

// 画像以外の領域をタップで閉じる(説明欄 #lbi は対象外=OCRを選択できる)
// img は #lbm 全面に広げて object-fit:contain で描画しているので、実際に絵が描かれている矩形の外側かどうかを計算する
function onPicture(e){
  const im=e.target;if(im.tagName!=='IMG'||!im.naturalWidth)return false;
  const b=im.getBoundingClientRect(),sc=Math.min(b.width/im.naturalWidth,b.height/im.naturalHeight);
  const w=im.naturalWidth*sc,h=im.naturalHeight*sc,l=b.left+(b.width-w)/2,t=b.top+(b.height-h)/2;
  return e.clientX>=l&&e.clientX<=l+w&&e.clientY>=t&&e.clientY<=t+h;
}

let tx=0,ty=0;
$('#lbm').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});

});

// ---- 更新確認 ----
// ホーム画面に追加した iOS の Web アプリは HTML を強くキャッシュし、タスクキルでも古いまま残ることがある。
// 起動時に build-info.js を no-store で取り直し、デプロイ済みの sha が今のページと違えば ?v=<sha> 付きの URL へ移動して読み直す(別URL=別キャッシュなので確実に新しい HTML が来る)
async function checkUpdate(){
  const cur=window.BUILD_INFO&&BUILD_INFO.sha;if(!cur||cur==='dev'||/[?&](code|error)=/.test(location.search))return;  // 認可の戻り(code は1回しか使えない)では動かさない
  try{
    const t=await (await fetch('build-info.js?nc='+Date.now(),{cache:'no-store'})).text();
    const m=t.match(/sha:\s*'([0-9a-f]+)'/);if(!m||m[1]===cur)return;
    if(sessionStorage.getItem('gt_upd')===m[1])return;  // 同じ版へ移動済み(デプロイ反映待ちなど)なら繰り返さない
    sessionStorage.setItem('gt_upd',m[1]);
    const u=new URL(location.href);u.searchParams.set('v',m[1]);location.replace(u);
  }catch(e){}
}
checkUpdate();

const pf={run:false,stop:false};

    let done=0;
    for(let k=0;k<tl.length&&!pf.stop;k+=25){
      if(cmetaTotal>=BUDGET()*0.4)break;
      const b=tl.slice(k,k+25);
      const j=await pfRpc('files/get_thumbnail_batch',{entries:b.map(it=>({path:imgPath(it),format:'jpeg',size:'w256h256',mode:'bestfit'}))});
      for(let n=0;n<j.entries.length;n++){const e=j.entries[n];
        if(e['.tag']==='success')await cachePut('/__thumb/'+b[n].i,new Blob([Uint8Array.from(atob(e.thumbnail),c=>c.charCodeAt(0))],{type:'image/jpeg'}))}
      done+=b.length;pfStatus(`サムネ ${done}/${tl.length} · ${mb()}`);
    }
    // 2) 閲覧数上位の原寸
    if(!pf.stop){
      let ids=[];try{ids=(await download('/index/hot.json')).ids||[]}catch(e){}
      const local=Object.entries(visits).sort((a,b)=>b[1].n-a[1].n||b[1].t-a[1].t).map(([id])=>id);
      const byId=new Map(pub.map(it=>[it.i,it]));
      const fl=[...new Set([...ids,...local])].map(id=>byId.get(id)).filter(it=>it&&(it.e||'').toLowerCase()!=='mp4'&&!cmeta.has('/__full/'+it.i));
      let n=0,full=false,fails=0;
      const worker=async()=>{while(!pf.stop&&!full&&fails<5){
        const it=fl[n++];if(!it)return;
        try{
          const blob=await dlFull(it);
          if(cmetaTotal+blob.size>BUDGET()){full=true;return}
          await cachePut('/__full/'+it.i,blob);fails=0;
        }catch(e){fails++;console.warn(e);await sleep(3000)}
        pfStatus(`原寸 ${Math.min(n,fl.length)}/${fl.length} · ${mb()}`);
      }};
      await Promise.all([worker(),worker(),worker()]);
      msg=full?'上限に達しました':fails>=5?'通信エラーで止めました':n>=fl.length?'完了':'';
    }
    if(pf.stop)msg='中断しました';
  }catch(e){console.warn(e);msg='失敗: '+(e.message||e)}
  finally{
    pf.run=false;pf.stop=false;$('#pf').classList.remove('on');
    document.removeEventListener('visibilitychange',onVis);try{wl&&wl.release()}catch(e){}
    pfStatus((msg||'終了')+' · '+mb());setTimeout(()=>{if(!pf.run)pfStatus('')},8000);
    showCache();
  }
}
$('#pf').onclick=prefetch;

// ---- 暗号化した画像(protected) ----
// /index/crypto.json(salt と検証データ)があれば 🔒 を出す。パスフレーズから導出した鍵(取り出し不可の CryptoKey)は
// この端末の IndexedDB に残し、次からは入力不要。一覧(/index/protected.bin)を復号して通常の一覧に混ぜる。
// 復号した画像・サムネイルは端末のキャッシュに保存しない(メモリのみ)。🔒 を押すとロック(鍵と復号済みデータを消す)。
let pubItems=[],protItems=[],pkey=null,pparams=null;
const showTrash=()=>LS('gt_trash')==='1';  // ゴミ(it.z)は既定で隠す。設定の「ゴミも表示する」で出す
function mergeItems(){
  const all=protItems.length?pubItems.concat(protItems).sort((a,b)=>a.t<b.t?1:a.t>b.t?-1:0):pubItems.slice();
  items=showTrash()?all:all.filter(it=>!it.z);
}
const idb=()=>new Promise((ok,ng)=>{const r=indexedDB.open('gt_crypto',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)});
async function idbGet(k){try{const d=await idb();return await new Promise(ok=>{const r=d.transaction('k').objectStore('k').get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)})}catch(e){return null}}
async function idbSet(k,v){try{const d=await idb();await new Promise((ok,ng)=>{const t=d.transaction('k','readwrite');v==null?t.objectStore('k').delete(k):t.objectStore('k').put(v,k);t.oncomplete=ok;t.onerror=()=>ng(t.error)})}catch(e){console.warn(e)}}
async function loadProtected(key){
  const arr=JSON.parse(new TextDecoder().decode(await GT_CRYPTO.decrypt(key,await downloadBuf('/index/protected.bin'),'index')));
  pkey=key;protItems=arr.map(it=>(it.x=1,it));
  mergeItems();applyFilter();setLock(true);
}
function setLock(on){$('#lock').textContent=on?'🔓':'🔒';$('#lock').title=on?'暗号化した画像をロック':'暗号化した画像を開く'}
async function initProtected(){
  try{
    pparams=await download('/index/crypto.json');
  }catch(e){return}  // 暗号化した画像が無い
  $('#lock').hidden=false;setLock(false);
  const k=await idbGet('key');
  if(k&&await GT_CRYPTO.verify(k,pparams)){try{await loadProtected(k)}catch(e){console.warn(e);setLock(false)}}
}
async function lockProtected(){
  await idbSet('key',null);
  for(const it of protItems)for(const m of [thumbCache,fullMem]){const u=m.get(it.i);if(u){URL.revokeObjectURL(u);m.delete(it.i)}}
  pkey=null;protItems=[];mergeItems();closeLb();applyFilter();setLock(false);
}
function askPass(){$('#pwe').textContent='';$('#pwi').value='';$('#pw').hidden=false;$('#pwi').focus()}
$('#lock').onclick=()=>pkey?lockProtected():askPass();
$('#pwc').onclick=()=>{$('#pw').hidden=true};
$('#pwf').onsubmit=async e=>{
  e.preventDefault();
  const b=$('#pwf button'),pass=$('#pwi').value;if(!pass)return;
  b.disabled=true;$('#pwe').textContent='確認中…';
  try{
    const key=await GT_CRYPTO.deriveKey(pass,pparams);
    if(!await GT_CRYPTO.verify(key,pparams)){$('#pwe').textContent='パスフレーズが違います';return}
    await loadProtected(key);await idbSet('key',key);
    $('#pw').hidden=true;
  }catch(err){$('#pwe').textContent='失敗: '+(err.message||err)}
  finally{b.disabled=false;$('#pwi').value=''}
};
function showBuild(){
  $('#bt').textContent=window.BUILD_INFO?`build ${BUILD_INFO.sha} (${BUILD_INFO.time}) · `:'';
  const n=Object.keys(visits).length,ex=+LS('gt_exported')||0;
  $('#cfgvis').textContent=`${n}枚 / 未反映のメモ ${Object.keys(notes).length}件`;
  $('#cfgexp').textContent=ex?new Date(ex).toLocaleString('ja-JP',{dateStyle:'short',timeStyle:'short'}):'なし';
}
showBuild();
{const c=$('#cfg'),g=$('#gear');
const tg=o=>{c.hidden=!o;g.setAttribute('aria-expanded',o);if(o)showCache()};
g.onclick=e=>{e.stopPropagation();tg(c.hidden)};
document.addEventListener('click',e=>{if(!c.hidden&&!c.contains(e.target))tg(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!c.hidden)tg(false)});}
async function showCache(){
  const el=$('#cachesz');if(!el)return;
  const n=async name=>{try{return (await (await caches.open(name)).keys()).length}catch(e){return 0}};
  const [f,t,a]=await Promise.all([n(FULL_CACHE),n(THUMB_CACHE),n(ANIM_CACHE)]);
  await metaSync();
  el.textContent=`${fmtSize(cmetaTotal)}(上限 ${Math.round(BUDGET()/1048576)}MB)`;
  $('#cache-f').textContent=f+'枚';$('#cache-t').textContent=t+'枚';$('#cache-a').textContent=a+'枚';
}
$('#cachedel').onclick=async()=>{
  if(!confirm('端末に保存した画像キャッシュを削除しますか?(次に見るとき Dropbox から取り直します。閲覧履歴・メモ・設定は消えません)'))return;
  for(const k of [FULL_CACHE,THUMB_CACHE,ANIM_CACHE])try{await caches.delete(k)}catch(e){}
  await metaClear();thumbCache.clear();animCache.clear();fullMem.clear();
  showCache();
};
$('#trash').checked=showTrash();
$('#trash').onchange=e=>{LSset('gt_trash',e.target.checked?'1':null);mergeItems();applyFilter()};
$('#budget').value=Math.round(BUDGET()/1048576);
$('#budget').onchange=async e=>{const v=Math.max(100,Math.round(+e.target.value)||3000);e.target.value=v;LSset('gt_budget',String(v));await enforce();showCache()};
$('#expv').onclick=exportVisits;
$('#imgurid').value=LS('gt_imgur')||'';
$('#imgurid').oninput=e=>LSset('gt_imgur',e.target.value.trim()||null);
$('#login').onclick=startLogin;
$('#out').onclick=()=>{if(confirm('この端末の認可を消しますか?')){['gt_refresh','gt_key'].forEach(k=>LSset(k,null));location.reload()}};
(async()=>{
  $('#redir').textContent=REDIR;$('#key').value=LS('gt_key')||'';
  const p=new URLSearchParams(location.search);
  try{
    if(p.get('code')){await finishLogin(p.get('code'),p.get('state'));history.replaceState(null,'',REDIR)}
    else if(p.get('error')){history.replaceState(null,'',REDIR);throw new Error(p.get('error_description')||p.get('error'))}
    if(!LS('gt_refresh')){$('#setup').hidden=false;return}
    $('#app').hidden=false;
    await loadIndex();
  }catch(e){
    $('#err').textContent=String(e.message||e);
    if(LS('gt_refresh')&&!$('#app').hidden)$('#grid').innerHTML='<div class="msg">読み込み失敗: '+esc(e.message||e)+'</div>';
    else $('#setup').hidden=false;
  }
})();
