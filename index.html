<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>gyazo-tycoon</title>
<style>
:root{--bg:#3d424c;--panel:#474d58;--line:#5d6471;--fg:#f0f2f5;--dim:#b4bac6;--accent:#7db2ff}
*{box-sizing:border-box}
html,body{overflow-x:hidden;max-width:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"Hiragino Sans",sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
select{background:#555c69;color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:6px 8px;font:inherit;font-size:16px}
input,button{background:#555c69;color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:6px 10px;font:inherit}
input{font-size:16px}  /* 16px未満だとiOSがフォーカス時にズームする */
button{cursor:pointer}
#q{flex:1 1 120px;min-width:0;width:0}
#stat{color:var(--dim);font-size:12px;white-space:nowrap}
#grid{padding:10px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.tile{position:relative;aspect-ratio:1;background:#2f333b;border-radius:6px;overflow:hidden;cursor:pointer}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.tile .d{position:absolute;bottom:0;left:0;right:0;font-size:10px;background:#000a;padding:0 4px;color:#ddd}
.msg{padding:40px 16px;text-align:center;color:var(--dim);grid-column:1/-1}
#setup{max-width:480px;margin:40px auto;padding:0 16px;display:flex;flex-direction:column;gap:12px}
#setup[hidden],#app[hidden]{display:none}
#setup code{background:#2f333b;padding:0 4px;border-radius:3px;word-break:break-all}
#lb{position:fixed;inset:0;background:#000e;display:none;z-index:9;flex-direction:column}
#lb.on{display:flex}
#lbm{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
#lbm img{width:100%;height:100%;object-fit:contain}  /* サムネイルと原寸で同じ枠・同じ位置にする(差し替え時に大きさが跳ねない) */
#lbi{height:25vh;overflow:auto;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--panel);font-size:12px}
#lbi a{color:var(--accent);word-break:break-all}
#lbi pre{white-space:pre-wrap;word-break:break-all;color:var(--dim);margin:6px 0 0}
#lbm{position:relative}
#lbm.loading img,#lbm.failed img{filter:blur(3px) brightness(.7);-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}  /* 荒いサムネイルは保存できないようにする */
#lbm.loading::after{content:"";position:absolute;top:50%;left:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border:4px solid #fff5;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;pointer-events:none}
#lbm.failed::after{content:"読み込み失敗";position:absolute;top:50%;left:0;right:0;text-align:center;color:#ff8a8a;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
#build{padding:16px 12px calc(16px + env(safe-area-inset-bottom));text-align:center;color:var(--dim);font-size:11px}
#lbx{position:absolute;top:8px;right:8px;z-index:2;font-size:18px}
</style>
</head>
<body>
<div id="setup" hidden>
  <h2>gyazo-tycoon</h2>
  <p>Dropbox アプリの App key を入力して認可します(この端末の localStorage にだけ保存。読み取り権限のみ要求)。</p>
  <p>このページのURL <code id="redir"></code> を、Dropbox アプリの Redirect URIs に登録しておいてください。</p>
  <input id="key" placeholder="App key" autocomplete="off" autocapitalize="off">
  <button id="login">Dropbox で認可する</button>
  <p id="err" style="color:#ff8a8a"></p>
</div>
<div id="app" hidden>
  <header>
    <input id="q" type="search" placeholder="検索">
    <select id="sort" title="並び順"><option value="new">新しい順</option><option value="old">古い順</option><option value="visited">最近開いた順</option><option value="viewed">閲覧数順</option></select>
    <span id="stat"></span>
    <button id="out" title="この端末の認可を消す">⏏</button>
  </header>
  <div id="grid"></div>
</div>
<div id="build"></div>
<div id="lb"><button id="lbx">✕</button><div id="lbm"></div><div id="lbi"></div></div>
<script src="build-info.js"></script>
<script>
const $=s=>document.querySelector(s);
const LS=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const LSset=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const REDIR=location.origin+location.pathname;
const SCOPE='files.content.read files.content.write';  // write は閲覧履歴(/index/visits/<端末ID>.json)の送信にだけ使う
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');

// ---- 認可 (PKCE) ----
async function startLogin(){
  const key=$('#key').value.trim(); if(!key){$('#err').textContent='App key を入力してください';return}
  LSset('gt_key',key);
  const ver=b64u(crypto.getRandomValues(new Uint8Array(48))), state=b64u(crypto.getRandomValues(new Uint8Array(12)));
  const ch=b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(ver)));
  LSset('gt_ver',ver); LSset('gt_state',state);
  location.href='https://www.dropbox.com/oauth2/authorize?'+new URLSearchParams({client_id:key,response_type:'code',
    code_challenge:ch,code_challenge_method:'S256',token_access_type:'offline',scope:SCOPE,redirect_uri:REDIR,state});
}
async function tokenReq(params){
  const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',body:new URLSearchParams(params)});
  if(!r.ok)throw new Error('token '+r.status+' '+(await r.text()).slice(0,150));
  return r.json();
}
let access=null,expires=0;
async function token(){
  if(access&&Date.now()<expires-60000)return access;
  const j=await tokenReq({grant_type:'refresh_token',refresh_token:LS('gt_refresh'),client_id:LS('gt_key')});
  access=j.access_token;expires=Date.now()+j.expires_in*1000;return access;
}
async function finishLogin(code,state){
  if(state!==LS('gt_state'))throw new Error('state が一致しません');
  const j=await tokenReq({grant_type:'authorization_code',code,code_verifier:LS('gt_ver'),client_id:LS('gt_key'),redirect_uri:REDIR});
  LSset('gt_refresh',j.refresh_token);LSset('gt_ver',null);LSset('gt_state',null);
  access=j.access_token;expires=Date.now()+j.expires_in*1000;
}

// ---- Dropbox 呼び出し ----
async function rpc(host,ep,arg){
  const r=await fetch('https://'+host+'/2/'+ep,{method:'POST',headers:{Authorization:'Bearer '+await token(),'Content-Type':'application/json'},body:JSON.stringify(arg)});
  if(!r.ok)throw new Error(ep+' '+r.status);
  return r.json();
}
async function download(path){
  const r=await fetch('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{Authorization:'Bearer '+await token(),'Dropbox-API-Arg':JSON.stringify({path})}});
  if(!r.ok)throw new Error('download '+path+' '+r.status);
  return r.json();
}
async function downloadBlob(path){
  const r=await fetch('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{Authorization:'Bearer '+await token(),'Dropbox-API-Arg':JSON.stringify({path})}});
  if(!r.ok)throw new Error('download '+r.status);
  return URL.createObjectURL(await r.blob());
}
// gif は静止サムネイルのあと、動くサムネイル(/index/anim/…webp)に差し替える
const animCache=new Map();
async function animate(img){
  const id=img.dataset.id;
  try{
    if(!animCache.has(id))animCache.set(id,downloadBlob(`/index/anim/${id.slice(0,2)}/${id}.webp`));
    const u=await animCache.get(id);
    if(img.isConnected)img.src=u;
  }catch(e){animCache.delete(id);console.warn(e)}
}
const imgPath=it=>`/public/${it.i.slice(0,2)}/${it.i}.${it.e}`;

// ---- サムネイル: 25枚ずつ get_thumbnail_batch ----
const thumbQ=[],thumbBusy={v:false},thumbCache=new Map();
function wantThumb(img){thumbQ.push(img);pump()}
async function pump(){
  if(thumbBusy.v)return;thumbBusy.v=true;
  try{while(thumbQ.length){
    const batch=thumbQ.splice(0,25).filter(i=>i.isConnected);
    const todo=batch.filter(i=>{const c=thumbCache.get(i.dataset.id);if(c){i.src=c;if(i.dataset.a)animate(i);return false}return true});
    if(!todo.length)continue;
    try{
      const j=await rpc('content.dropboxapi.com','files/get_thumbnail_batch',{entries:todo.map(i=>({path:i.dataset.path,format:'jpeg',size:'w256h256',mode:'bestfit'}))});
      j.entries.forEach((e,k)=>{if(e['.tag']==='success'){const u='data:image/jpeg;base64,'+e.thumbnail;thumbCache.set(todo[k].dataset.id,u);todo[k].src=u;if(todo[k].dataset.a)animate(todo[k])}});
    }catch(e){console.warn(e)}
  }}finally{thumbBusy.v=false}
}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);wantThumb(e.target)}}),{rootMargin:'400px'});

// ---- 閲覧履歴(この端末のみ。localStorage。last visited / most viewed 用) ----
const VISITS_KEY='gt_visits_v1';
const visits=(()=>{try{return JSON.parse(LS(VISITS_KEY)||'{}')}catch(e){return {}}})();  // {id: {t: 最終閲覧(ms), n: 回数}}
let visitTimer;
function recordVisit(id){
  const v=visits[id]||{t:0,n:0};visits[id]={t:Date.now(),n:v.n+1};
  visitsDirty=true;
  clearTimeout(visitTimer);visitTimer=setTimeout(()=>LSset(VISITS_KEY,JSON.stringify(visits)),300);
}
// 閲覧履歴を Dropbox へ送る(スマホ→Mac。Mac の gyazo-tycoon が /index/visits/ を取り込んで閲覧数に足す)。
// 端末ごとの「累計」を上書き保存するだけなので、再送しても二重に数えられない。
let visitsDirty=Object.keys(visits).length>0,visitsErr='';  // 起動時に既存の履歴も一度送る
const DEVICE=(()=>{let d=LS('gt_device');if(!/^[0-9a-f]{16}$/.test(d||'')){d=[...crypto.getRandomValues(new Uint8Array(8))].map(b=>b.toString(16).padStart(2,'0')).join('');LSset('gt_device',d)}return d})();
async function flushVisits(){
  if(!visitsDirty)return;
  visitsDirty=false;
  const out={};for(const[id,v]of Object.entries(visits))out[id]=[v.n,v.t];
  try{
    const r=await fetch('https://content.dropboxapi.com/2/files/upload',{method:'POST',headers:{Authorization:'Bearer '+await token(),
      'Dropbox-API-Arg':JSON.stringify({path:`/index/visits/${DEVICE}.json`,mode:'overwrite',mute:true}),'Content-Type':'application/octet-stream'},
      body:JSON.stringify({v:1,device:DEVICE,updated:Date.now(),visits:out})});
    if(!r.ok)throw new Error(r.status===401||r.status===403?'scope':'upload '+r.status);
    visitsErr='';
  }catch(e){visitsDirty=true;visitsErr=e.message==='scope'?'閲覧履歴の送信には再認可が必要です(⏏で認可を消して、もう一度認可)':'閲覧履歴の送信に失敗(再試行します)'}
  showBuild();
}
setInterval(flushVisits,60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushVisits()});

// ---- 一覧 ----
let items=[],shown=0,filtered=[];
const PAGE=120;
const hay=it=>(it._h??=[it.s,it.ti,it.g,it.b,it.n,it.u,it.t].filter(Boolean).join(' ').toLowerCase());
function applyFilter(){
  const terms=$('#q').value.toLowerCase().split(/\s+/).filter(Boolean);
  filtered=terms.length?items.filter(it=>terms.every(t=>hay(it).includes(t))):items;
  const sort=$('#sort').value;
  if(sort==='old')filtered=filtered.slice().reverse();
  else if(sort==='visited'||sort==='viewed'){  // 開いたことのある画像だけが対象
    filtered=filtered.filter(it=>visits[it.i]);
    filtered.sort(sort==='visited'?(a,b)=>visits[b.i].t-visits[a.i].t:(a,b)=>visits[b.i].n-visits[a.i].n||visits[b.i].t-visits[a.i].t);
  }
  window.scrollTo(0,0);
  $('#grid').innerHTML='';shown=0;more();
  $('#stat').textContent=filtered.length.toLocaleString()+' 枚';
  if(!filtered.length)$('#grid').innerHTML='<div class="msg">'+(/^(visited|viewed)$/.test(sort)?'まだ開いた画像がありません':'該当なし')+'</div>';
}
function more(){
  const g=$('#grid'),end=Math.min(shown+PAGE,filtered.length);
  const html=[];
  for(let k=shown;k<end;k++){const it=filtered[k];
    html.push(`<div class="tile" data-k="${k}"><img data-id="${it.i}"${it.a?' data-a="1"':''} data-path="${esc(imgPath(it))}" alt=""><div class="d">${esc(it.t.slice(0,16))}</div></div>`)}
  g.insertAdjacentHTML('beforeend',html.join(''));
  g.querySelectorAll('img:not([data-o])').forEach(i=>{i.dataset.o=1;io.observe(i)});
  shown=end;
}
addEventListener('scroll',()=>{if(shown<filtered.length&&innerHeight+scrollY>document.body.scrollHeight-800)more()});
$('#sort').value=['new','old','visited','viewed'].includes(LS('gt_sort'))?LS('gt_sort'):'new';
$('#sort').addEventListener('change',()=>{LSset('gt_sort',$('#sort').value);applyFilter()});
$('#q').addEventListener('input',()=>{clearTimeout($('#q')._t);$('#q')._t=setTimeout(applyFilter,150)});

// ---- 拡大 ----
// 原寸画像のキャッシュ: メモリ(blob URL, 直近24枚)+ Cache Storage(端末に残る, 直近150枚)。
// 取得は files/download(認可ヘッダ付き)。一度見た画像・先読みした前後の画像はスピナー無しで出る
const fullMem=new Map(),fullPending=new Map(),FULL_MEM=24,FULL_DISK=150;
async function getFull(it){
  const id=it.i;
  if(fullMem.has(id)){const u=fullMem.get(id);fullMem.delete(id);fullMem.set(id,u);return u}  // LRU更新
  if(fullPending.has(id))return fullPending.get(id);
  const p=(async()=>{
    let blob=null,cache=null;const key='/__full/'+id;
    try{cache=await caches.open('gt-full-v1');const m=await cache.match(key);if(m)blob=await m.blob()}catch(e){}
    if(!blob){
      const r=await fetch('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{Authorization:'Bearer '+await token(),'Dropbox-API-Arg':JSON.stringify({path:imgPath(it)})}});
      if(!r.ok)throw new Error('download '+r.status);
      blob=await r.blob();
      try{if(cache){await cache.put(key,new Response(blob,{headers:{'Content-Type':blob.type}}));
        const ks=await cache.keys();for(const k of ks.slice(0,Math.max(0,ks.length-FULL_DISK)))await cache.delete(k)}}catch(e){}
    }
    const u=URL.createObjectURL(blob);
    fullMem.set(id,u);
    while(fullMem.size>FULL_MEM){const [oid,ou]=fullMem.entries().next().value;fullMem.delete(oid);URL.revokeObjectURL(ou)}
    return u;
  })();
  fullPending.set(id,p);
  try{return await p}finally{fullPending.delete(id)}
}
let cur=-1,lbTok=0;
async function openLb(k){
  const it=filtered[k],lb=$('#lb'),tok=++lbTok;
  if(cur!==k)recordVisit(it.i);  // 開いた記録(同じ画像の再表示は数えない。先読みは数えない)
  cur=k;
  lb.classList.add('on');
  const hit=fullMem.get(it.i);
  $('#lbm').className=hit?'':'loading';
  $('#lbm').innerHTML='<img alt="" src="'+(hit||thumbCache.get(it.i)||'')+'">';
  const meta=[it.t,it.s,it.ti&&esc(it.ti),it.g&&esc(it.g)].filter(Boolean).join(' / ');
  $('#lbi').innerHTML=`<div>${meta}</div>`+(it.u?`<div><a href="${esc(it.u)}" target="_blank" rel="noopener">${esc(it.u)}</a></div>`:'')
    +(it.n?`<pre>${esc(it.n)}</pre>`:'')+(it.b?`<pre>${esc(it.b)}</pre>`:'');
  try{
    const url=await getFull(it);
    // 先にデコードを済ませてから差し替える(読み込み中はサムネイルのまま)
    const im=new Image();im.src=url;
    await im.decode();
    if(lb.classList.contains('on')&&tok===lbTok){const t=$('#lbm img');if(t)t.src=url;$('#lbm').className=''
      // 前後の画像を先読み(スワイプで即表示)
      for(const n of [k+1,k-1])if(filtered[n])getFull(filtered[n]).catch(()=>{})}
  }catch(e){console.warn(e);if(tok===lbTok)$('#lbm').className='failed'}
}
$('#grid').addEventListener('click',e=>{const t=e.target.closest('.tile');if(t)openLb(+t.dataset.k)});
const closeLb=()=>{flushVisits();lbTok++;$('#lbm').className='';cur=-1;$('#lb').classList.remove('on');$('#lbm').innerHTML=''};
$('#lbx').onclick=closeLb;
function step(d){
  const k=cur+d;if(cur<0||k<0||k>=filtered.length)return;
  if(k>=shown)more();
  openLb(k);
}
// 画像以外の領域をタップで閉じる(説明欄 #lbi は対象外=OCRを選択できる)
// img は #lbm 全面に広げて object-fit:contain で描画しているので、実際に絵が描かれている矩形の外側かどうかを計算する
function onPicture(e){
  const im=e.target;if(im.tagName!=='IMG'||!im.naturalWidth)return false;
  const b=im.getBoundingClientRect(),sc=Math.min(b.width/im.naturalWidth,b.height/im.naturalHeight);
  const w=im.naturalWidth*sc,h=im.naturalHeight*sc,l=b.left+(b.width-w)/2,t=b.top+(b.height-h)/2;
  return e.clientX>=l&&e.clientX<=l+w&&e.clientY>=t&&e.clientY<=t+h;
}
$('#lbm').addEventListener('click',e=>{if(!onPicture(e))closeLb()});
// 左右スワイプで前後の画像へ
let tx=0,ty=0;
$('#lbm').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
$('#lbm').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){e.preventDefault();step(dx<0?1:-1)}
});
addEventListener('keydown',e=>{if(cur<0)return;if(e.key==='Escape')closeLb();else if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1)});

// ---- 起動 ----
async function loadIndex(){
  $('#grid').innerHTML='<div class="msg">読み込み中…</div>';
  const man=await download('/index/manifest.json');
  const all=[];
  // 新しい月から順に読み、1か月ごとに表示を更新
  for(const m of man.months){
    const arr=await download(`/index/${m.m}.json`);
    all.push(...arr);items=all.slice();
    if(all.length===arr.length||all.length<=PAGE*2)applyFilter();
    else $('#stat').textContent=items.length.toLocaleString()+' 枚…';
  }
  applyFilter();
}
function showBuild(){
  const t=window.BUILD_INFO?`build ${BUILD_INFO.sha} (${BUILD_INFO.time})`:'';
  $('#build').textContent=t;
  if(visitsErr){const d=document.createElement('div');d.style.color='#ff8a8a';d.textContent=visitsErr;$('#build').append(d)}
}
showBuild();
$('#login').onclick=startLogin;
$('#out').onclick=()=>{if(confirm('この端末の認可を消しますか?')){['gt_refresh','gt_key'].forEach(k=>LSset(k,null));location.reload()}};
(async()=>{
  $('#redir').textContent=REDIR;$('#key').value=LS('gt_key')||'';
  const p=new URLSearchParams(location.search);
  try{
    if(p.get('code')){await finishLogin(p.get('code'),p.get('state'));history.replaceState(null,'',REDIR)}
    else if(p.get('error')){history.replaceState(null,'',REDIR);throw new Error(p.get('error_description')||p.get('error'))}
    if(!LS('gt_refresh')){$('#setup').hidden=false;return}
    $('#app').hidden=false;
    await loadIndex();
  }catch(e){
    $('#err').textContent=String(e.message||e);
    if(LS('gt_refresh')&&!$('#app').hidden)$('#grid').innerHTML='<div class="msg">読み込み失敗: '+esc(e.message||e)+'</div>';
    else $('#setup').hidden=false;
  }
})();
</script>
</body>
</html>
